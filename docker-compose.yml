version: '3.8'

services:
  # Relational Clinical Database
  postgres:
    image: postgres:16-alpine
    container_name: aarogya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aarogya
      POSTGRES_PASSWORD: aarogya_secret
      POSTGRES_DB: aarogya_drishti_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aarogya -d aarogya_drishti_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # In-Memory Cache & Background Task Queue
  redis:
    image: redis:7-alpine
    container_name: aarogya_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Private S3-Compatible Object Storage for Clinical Photos
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: aarogya_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 3

  # Core NestJS Modular Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aarogya_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://aarogya:aarogya_secret@postgres:5432/aarogya_drishti_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aarogya-clinical-images
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      JWT_SECRET: replace-with-a-unique-random-jwt_secret
      JWT_REFRESH_SECRET: replace-with-a-unique-random-jwt_refresh_secret
      CARE_DATA_DIR: /usr/src/app/data
    volumes:
      - care_data:/usr/src/app/data
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  care_data:
  postgres_data:
  redis_data:
  minio_data:
