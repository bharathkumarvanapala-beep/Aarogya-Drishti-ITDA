services:
  - type: web
    name: aarogya-drishti-research
    runtime: python
    rootDir: ai-service
    plan: free
    buildCommand: pip install -r requirements-demo.txt
    startCommand: uvicorn hosted_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_AI_AUTH
        value: "true"
      - key: AI_SERVICE_TOKEN
        sync: false
